---
- name: Ensure the secret that stores the external registry credentials exists
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: external-registry-credentials
        namespace: "{{ namespace }}"
      stringData:
        username: my-registry-user
        password: my-registry-password
